<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset your password · Cipher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to content</a>

<div class="center-card-shell" id="main">
  <div class="card card--glass center-card fade-up">
    <div class="form-panel__top" style="margin-bottom:22px;">
      <a class="brand" href="login.html" style="color:var(--text)">
        <span class="brand__mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2L4 6v6c0 5 3.4 8.7 8 10 4.6-1.3 8-5 8-10V6l-8-4z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
        </span>
        Cipher
      </a>
      <button class="btn btn--icon" data-theme-toggle aria-label="Toggle dark mode" aria-pressed="false">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none"><path d="M12 3v1M12 20v1M4.2 4.2l.8.8M19 19l.8.8M3 12h1M20 12h1M4.2 19.8l.8-.8M19 5l.8-.8M12 7a5 5 0 100 10 5 5 0 000-10z" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div id="requestView">
      <div class="form-header">
        <h1>Forgot your password?</h1>
        <p>Enter the email on your account and we'll simulate sending a secure reset link.</p>
      </div>
      <form id="forgotForm" novalidate>
        <div class="field">
          <label class="field__label" for="email">Email address</label>
          <input class="field__input" type="email" id="email" name="email" autocomplete="email" placeholder="you@example.com">
          <span class="field__error" id="emailError"></span>
        </div>
        <button type="submit" class="btn btn--primary" id="submitBtn">Send reset link</button>
      </form>
      <p class="form-footer"><a href="login.html">← Back to sign in</a></p>
    </div>

    <div id="successView" style="display:none;">
      <div class="success-badge">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 13l4 4L19 7" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="form-header" style="text-align:center;">
        <h1>Check your inbox</h1>
        <p>We've simulated an email to <b id="sentToEmail" style="color:var(--text)"></b>. Since this project has no backend, here's the link it would have contained:</p>
      </div>
      <div class="reset-link-box" id="resetLinkBox"></div>
      <button class="btn btn--ghost btn--block" id="openLinkBtn" style="margin-top:16px;">Open reset link</button>
      <p class="form-footer"><a href="login.html">← Back to sign in</a></p>
    </div>
  </div>
</div>

<script src="storage.js"></script>
<script src="auth.js"></script>
<script src="ui.js"></script>
<script>
  Auth.redirectIfAuthed();

  const form = document.getElementById("forgotForm");
  const email = document.getElementById("email");
  const submitBtn = document.getElementById("submitBtn");

  email.addEventListener("input", () => UI.clearFieldError(email));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const err = Auth.validateEmail(email.value);
    UI.setFieldError(email, err);
    if (err) return;

    UI.setButtonLoading(submitBtn, true, "Sending…");
    await new Promise((r) => setTimeout(r, 700));
    UI.setButtonLoading(submitBtn, false);

    const user = Storage.findUserByEmail(email.value);
    if (!user) {
      // Deliberately vague to avoid confirming which emails are registered.
      UI.toast("If that email exists, a reset link has been sent.", "info");
      return;
    }

    const token = Auth.generateResetToken(user.email);
    const link = `${location.origin}${location.pathname.replace("forgot-password.html", "")}reset-password.html?email=${encodeURIComponent(user.email)}&token=${token}`;

    document.getElementById("sentToEmail").textContent = user.email;
    document.getElementById("resetLinkBox").textContent = link;
    document.getElementById("openLinkBtn").onclick = () => (window.location.href = link);

    document.getElementById("requestView").style.display = "none";
    document.getElementById("successView").style.display = "block";
    document.getElementById("successView").classList.add("fade-up");
    UI.toast("Reset link generated.", "success");
  });
</script>
</body>
</html>
